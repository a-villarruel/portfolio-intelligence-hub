services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portfolio_intelligence_hub
      POSTGRES_USER: pih
      POSTGRES_PASSWORD: pih_dev_password
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pih -d portfolio_intelligence_hub']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
