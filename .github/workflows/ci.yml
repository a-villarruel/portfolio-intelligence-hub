name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://pih:pih_dev_password@localhost:5432/portfolio_intelligence_hub?schema=public
      WEB_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout v4.3.1
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # pnpm/action-setup v4.1.0
        with:
          version: 12.21.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: git ls-files --error-unmatch apps/api/openapi.json packages/api-client/src/generated/schema.d.ts
      - run: git diff --exit-code HEAD -- apps/api/openapi.json packages/api-client/src/generated/schema.d.ts
      - run: pnpm format:check
